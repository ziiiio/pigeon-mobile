name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast lane: lint + unit-test the Rust core on the native runner arch (no NDK,
  # no Android SDK). Runs the same `cargo fmt`/`clippy`/`test` the dev container
  # gates on locally.
  core:
    runs-on: ubuntu-latest
    steps:
      # The core path-depends on ../pigeon/crates/*, so check both repos out as
      # siblings under the workspace (pigeon-mobile/ next to pigeon/).
      # The homeserver repo is private, so the sibling checkout authenticates with
      # a read-only DEPLOY KEY on ziiiio/pigeon whose private half is stored as the
      # PIGEON_DEPLOY_KEY repo secret (least privilege: read access to that one
      # repo, nothing else) — the default GITHUB_TOKEN can only read
      # this repo.
      - uses: actions/checkout@v5
        with:
          path: pigeon-mobile
      - uses: actions/checkout@v5
        with:
          repository: ziiiio/pigeon
          path: pigeon
          ssh-key: ${{ secrets.PIGEON_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pigeon-mobile/core

      - name: fmt
        working-directory: pigeon-mobile/core
        # Scope to our package: `--all` would also format the sibling `pigeon`
        # crates pulled in as path-deps, letting their style drift fail our lane.
        run: cargo fmt -p pigeon-mobile-core --check
      - name: clippy
        working-directory: pigeon-mobile/core
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: pigeon-mobile/core
        run: cargo test
      # M5.1: the Swift bindings are platform-independent (read from the built
      # library's metadata), so verify they generate on the Linux lane too — this
      # guards the shared-core → Swift boundary without needing macOS.
      - name: generate swift bindings (smoke)
        working-directory: pigeon-mobile/core
        run: |
          cargo build
          cargo run --bin uniffi-bindgen -- generate \
            --library target/debug/libpigeon_mobile_core.so \
            --language swift --out-dir target/bindings/swift
          test -f target/bindings/swift/pigeon_mobile_core.swift

  # Supply-chain lane: cargo-deny over the shared Rust core — RUSTSEC advisories,
  # a permissive-license allowlist, and source restrictions, from core/deny.toml
  # (mirrors ../pigeon's policy). Fails the build on a *new* advisory, so a
  # vulnerable crate in what ships inside both apps can't slip in unnoticed.
  # Needs the sibling pigeon checkout only so cargo can resolve the path-deps;
  # the action bundles cargo-deny, so no toolchain/build is needed. cargo-deny
  # picks up core/deny.toml from beside the manifest.
  deny:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: pigeon-mobile
      - uses: actions/checkout@v5
        with:
          repository: ziiiio/pigeon
          path: pigeon
          ssh-key: ${{ secrets.PIGEON_DEPLOY_KEY }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: pigeon-mobile/core/Cargo.toml
          command: check

  # Android lane: cross-compile the core (cargo-ndk) and assemble the app. The
  # ubuntu runner is amd64, so the NDK's x86_64 toolchain runs natively (no
  # emulation needed, unlike the Apple-Silicon dev container).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: pigeon-mobile
      - uses: actions/checkout@v5
        with:
          repository: ziiiio/pigeon
          path: pigeon
          ssh-key: ${{ secrets.PIGEON_DEPLOY_KEY }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # JDK 25 — AGP 9.2.1 / Gradle 9.6.1 need a modern JDK with a compiler.
          java-version: "25"
      # v3 ran `sdkmanager tools`; Google removed that legacy package from the
      # SDK repository, so the step failed ("Failed to find package 'tools'").
      # v4 installs platform-tools instead and runs on Node 24.
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install SDK 36 + NDK r28c
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pigeon-mobile/core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: assembleDebug
        working-directory: pigeon-mobile/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew assembleDebug --stacktrace
      # The JVM tests: the view-models' pure wording, merge and policy functions
      # (AuthErrorTest, CleartextPolicyTest, ChatErrorTest, BackupFeedbackTest,
      # TimelineMergeTest). Reuses the debug build above.
      - name: testDebugUnitTest
        working-directory: pigeon-mobile/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew testDebugUnitTest --stacktrace

  # End-to-end lane: the core's FFI driven against a real homeserver. The e2e
  # harness builds the pigeon-server binary from ../pigeon and runs it OUT OF
  # PROCESS on a throwaway postgres:16 container (docker CLI; ubuntu-latest ships
  # Docker). SQLX_OFFLINE: the server's sqlx query macros compile against pigeon's
  # committed .sqlx cache, as in its own CI. Both target dirs are cached.
  e2e:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          path: pigeon-mobile
      - uses: actions/checkout@v5
        with:
          repository: ziiiio/pigeon
          path: pigeon
          ssh-key: ${{ secrets.PIGEON_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pigeon-mobile/e2e
            pigeon

      - name: e2e (real homeserver + Postgres)
        working-directory: pigeon-mobile/e2e
        run: cargo test

  # iOS lane (M5.1): cross-compile the core for the Apple targets, generate the
  # Swift bindings, and package the xcframework. macOS-only — the iOS SDK is
  # needed to link the Apple targets (incl. rusqlite's bundled SQLite) and
  # `xcodebuild -create-xcframework` is macOS-only. The Linux `core` lane already
  # smoke-checks that the Swift bindings *generate*; this lane proves they build.
  ios:
    # macos-14 was retired by GitHub (jobs failed with "The configuration
    # 'macos-14-arm64-us-default' is not supported"). The project needs only
    # Swift 5.9 tools and an iOS 15 target, so any current image's Xcode works.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          path: pigeon-mobile
      - uses: actions/checkout@v5
        with:
          repository: ziiiio/pigeon
          path: pigeon
          ssh-key: ${{ secrets.PIGEON_DEPLOY_KEY }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pigeon-mobile/core

      - name: build xcframework + Swift bindings
        working-directory: pigeon-mobile
        run: ios/build-core.sh

      # M5.3 — build the real Pigeon app (OS-integration layer: KeychainKeyStore,
      # OsLogSink, PhotoPicker, SyncController) and run its unit tests on a
      # simulator. The KeychainKeyStore suite exercises the real iOS Keychain
      # (ad-hoc signed for the keychain-access-group entitlement). The iOS
      # analogue of Android's testDebugUnitTest.
      - name: build + test the Pigeon app on a simulator
        working-directory: pigeon-mobile/ios
        run: ./run-tests.sh

      # M5.4 — launch the real Pigeon app on a simulator and assert it boots into
      # its SwiftUI UI (RootView → the M1–M4 screens) without crashing and that
      # the core's host callbacks install at process start. run-tests.sh proves it
      # compiles + unit-tests pass; this proves the app actually runs on-device
      # (the iOS-specific risk beyond the core, which is e2e-tested separately).
      - name: build + launch the Pigeon app on a simulator
        working-directory: pigeon-mobile/ios
        run: ./run-app.sh