# pigeon-mobile-e2e — the Docker-gated end-to-end lane against a real homeserver.
#
# Deliberately a SEPARATE crate, not part of `core/`: it runs the real
# `pigeon-server` binary (built from ../pigeon) on a throwaway Postgres
# container, so it needs Docker at runtime. Keeping it out of `core/` means the
# container's fast `cargo test` and the core CI lane never build or run it.
#
# The server runs OUT OF PROCESS (tests/support/mod.rs): this crate does not
# depend on any homeserver crate, so the server's dependency graph never shares
# a binary with the app's. Linking them together once pinned the app's rusqlite
# to a vulnerable release (CLAUDE.md, "Tests never pin dependencies").
#
# Run it on a host with Docker:  (from this dir)  cargo test
[package]
name = "pigeon-mobile-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The crate under test + its typed errors.
pigeon-mobile-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
# Raw HTTP for the E2EE exit gate: fetch the room's stored events directly from
# the server to assert they contain only ciphertext, never plaintext (the mirror
# of the homeserver's own `e2ee_message` test). Test-lane only.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[[test]]
name = "oneshot"
path = "tests/oneshot.rs"
